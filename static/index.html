<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121613" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pantry">
<title>Pantry</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <div class="brand">
    <img src="/static/icon.svg" alt="" width="30" height="30">
    <span>Pantry</span>
  </div>
  <div class="header-actions">
    <button id="speak-toggle" class="icon-btn" type="button" aria-pressed="false" aria-label="Read replies aloud" title="Read replies aloud">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path class="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none"/></svg>
    </button>
    <button id="new-chat" class="icon-btn" type="button" aria-label="Start a new chat" title="Start a new chat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none"/></svg>
    </button>
  </div>
</header>

<main id="thread" aria-live="polite">
  <section id="welcome">
    <h1 id="hello">Hello</h1>
    <p>Tell me what you bought, used or need. You can type, talk, or send a photo of a receipt.</p>
    <div class="quick">
      <button type="button" data-action="photo"><span>🧾</span>Add a receipt</button>
      <button type="button" data-say="What's on the shopping list?"><span>🛒</span>Shopping list</button>
      <button type="button" data-say="What's expiring soon?"><span>⏳</span>Expiring soon</button>
      <button type="button" data-say="What can I cook with what we have?"><span>🍳</span>What can I cook?</button>
      <button type="button" data-fill="We're out of "><span>🫙</span>We're out of…</button>
      <button type="button" data-fill="Add to the shopping list: "><span>➕</span>Need to buy…</button>
    </div>
  </section>
</main>

<div id="activity" hidden><span class="dots"><i></i><i></i><i></i></span><span id="activity-label">Thinking</span></div>

<footer>
  <div id="previews"></div>
  <form id="composer" autocomplete="off">
    <button id="photo" class="icon-btn" type="button" aria-label="Add a photo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z" fill="none"/><circle cx="12" cy="13" r="3.5" fill="none"/></svg>
    </button>
    <textarea id="input" rows="1" placeholder="Message" enterkeyhint="send" aria-label="Message"></textarea>
    <button id="mic" class="round-btn" type="button" aria-label="Talk">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none"/></svg>
    </button>
    <button id="send" class="round-btn" type="submit" aria-label="Send" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" fill="none"/></svg>
    </button>
  </form>
  <div id="recorder" hidden>
    <button id="rec-cancel" class="icon-btn" type="button" aria-label="Cancel recording">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none"/></svg>
    </button>
    <div class="rec-body">
      <canvas id="wave" width="600" height="80"></canvas>
      <div id="rec-status">Listening…</div>
    </div>
    <button id="rec-done" class="round-btn" type="button" aria-label="Done talking">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none"/></svg>
    </button>
  </div>
  <input id="file" type="file" accept="image/*" multiple hidden>
</footer>
<div id="toast" role="status" hidden></div>
<script src="/static/app.js" defer></script>
</body>
</html>
