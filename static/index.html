<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#faf9f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pantry">
<title>Pantry</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/app.css">
<script>
// Apply the saved look before the page paints, so there is no flash of the wrong colours.
// (Wrapped in a function so its names don't collide with app.js.)
(function () { try {
  var look = JSON.parse(localStorage.getItem("look") || "{}"), root = document.documentElement;
  root.dataset.theme = look.theme === "light" || look.theme === "dark" ? look.theme : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  root.dataset.tone = look.tone || "warm";
  root.dataset.accent = look.accent || "green";
  root.dataset.size = look.size || "normal";
} catch (e) {} })();
</script>
</head>
<body>
<div id="scrim"></div>

<aside id="sidebar" aria-label="Menu">
  <div class="side-top">
    <div class="brand"><img src="/static/icon.svg" alt="" width="26" height="26"><span>Pantry</span></div>
    <button id="menu-close" class="icon-btn" type="button" aria-label="Close menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <button id="new-chat" class="side-row strong" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New chat
  </button>
  <nav id="history" aria-label="Past chats"></nav>
  <div class="side-foot">
    <button id="look-open" class="side-row" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.2 0 1.8-.9 1.8-1.8 0-1.3-.9-1.6-.9-2.7 0-1 .8-1.7 1.8-1.7h2a3.8 3.8 0 0 0 3.8-3.8c0-3.900-3.800-7-8.500-7z"/><circle cx="8" cy="11" r=".6"/><circle cx="11" cy="7.500" r=".6"/><circle cx="15.500" cy="8.500" r=".6"/></svg>Appearance
    </button>
    <button id="speak-toggle" class="side-row" type="button" role="switch" aria-checked="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4zM15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>
      <span>Read replies aloud</span><i class="switch"></i>
    </button>
    <a id="grocy-link" class="side-row" target="_blank" rel="noopener" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8M11 6H6v12h12v-5"/></svg>Open Grocy
    </a>
    <button id="sign-out" class="side-row" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H6v14h4M14 8l4 4-4 4M18 12H10"/></svg><span>Sign out</span>
    </button>
    <div class="me">
      <span class="avatar" id="avatar"></span>
      <div class="me-text"><div id="me-name"></div><div id="me-email"></div></div>
    </div>
  </div>
</aside>

<div id="app">
  <header>
    <button id="menu" class="icon-btn" type="button" aria-label="Open menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <span class="title">Pantry</span>
    <button id="new-top" class="icon-btn" type="button" aria-label="New chat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button id="avatar-top" class="avatar" type="button" aria-label="Account and menu"></button>
  </header>

  <main id="thread" aria-live="polite">
    <section id="welcome">
      <h1 id="hello">Hello</h1>
      <p>Tell me what you bought, used or need. Type it, say it, or send a photo of the receipt.</p>
      <div class="quick">
        <button type="button" data-action="photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>Add a receipt</button>
        <button type="button" data-say="What's on the shopping list?"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h2l2.5 10h10L20 8H6.5M9 19.5h.01M16 19.5h.01"/></svg>Shopping list</button>
        <button type="button" data-say="What's expiring soon?"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Expiring soon</button>
        <button type="button" data-say="What can I cook with what we have?"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h14v4a5 5 0 0 1-5 5h-4a5 5 0 0 1-5-5zM3 11h18M9 7c0-1.5 1-1.5 1-3M14 7c0-1.5 1-1.5 1-3"/></svg>What can I cook?</button>
        <button type="button" data-fill="We're out of "><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8v3l1.5 3v10a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2V9L8 6zM8 6h8"/></svg>We're out of…</button>
        <button type="button" data-fill="Add to the shopping list: "><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Need to buy…</button>
      </div>
    </section>
  </main>

  <div id="activity" hidden><span class="pulse"></span><span id="activity-label">Thinking</span></div>

  <footer>
    <button id="jump" type="button" aria-label="Go to the latest message" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5.5 12.5 12 19l6.5-6.5"/></svg>
    </button>
    <form id="composer" autocomplete="off">
      <div id="previews"></div>
      <textarea id="input" rows="1" placeholder="What did you buy or use?" enterkeyhint="send" aria-label="Message"></textarea>
      <div id="live" aria-live="off" hidden></div>
      <div class="composer-row">
        <button id="photo" class="icon-btn" type="button" aria-label="Add a photo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </button>
        <span class="grow"></span>
        <canvas id="wave" width="240" height="56" hidden></canvas>
        <button id="rec-cancel" class="square-btn" type="button" aria-label="Cancel" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <button id="rec-done" class="square-btn" type="button" aria-label="Done" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </button>
        <button id="mic" class="round-btn" type="button" aria-label="Talk">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
        </button>
        <button id="send" class="round-btn" type="submit" aria-label="Send" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
        </button>
      </div>
    </form>
    <input id="file" type="file" accept="image/*" multiple hidden>
  </footer>
</div>
<dialog id="look" aria-labelledby="look-title">
  <div class="look-head">
    <h2 id="look-title">Appearance</h2>
    <button id="look-close" class="icon-btn" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="look-label">Theme</div><div class="seg" data-pref="theme"></div>
  <div class="look-label">Background</div><div class="seg" data-pref="tone"></div>
  <div class="look-label">Colour</div><div class="swatches" data-pref="accent"></div>
  <div class="look-label">Text size</div><div class="seg" data-pref="size"></div>
  <p class="look-note">Saved on this device.</p>
</dialog>
<div id="lightbox" hidden><img alt="Photo"></div>
<div id="toast" role="status" hidden></div>
<script src="/static/app.js" defer></script>
</body>
</html>
